<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIBO Portal</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #eaecf0;
        --card-bg: #ffffff;
        --primary: #3b3fc4;
        --primary-dark: #2e31a8;
        --primary-light: #eef0ff;
        --primary-mid: #6366f1;
        --accent-orange: #f59e0b;
        --accent-green: #10b981;
        --accent-red: #ef4444;
        --text-900: #0f1117;
        --text-700: #374151;
        --text-500: #6b7280;
        --text-400: #9ca3af;
        --border: #e5e7eb;
        --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.06);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
        --shadow-primary: 0 4px 20px rgba(59, 63, 196, 0.28);
        --radius-sm: 10px;
        --radius-md: 14px;
        --radius-lg: 18px;
        --radius-xl: 24px;
        --sidebar-w: 260px;
        --font-display: "Plus Jakarta Sans", sans-serif;
        --font-body: "DM Sans", sans-serif;
      }
      html,
      body {
        font-family: var(--font-body);
        background: var(--bg);
        color: var(--text-700);
        min-height: 100vh;
      }
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 99px;
      }
      #app-layout {
        display: flex;
        min-height: 100vh;
      }

      /* SIDEBAR */
      #sidebar {
        width: var(--sidebar-w);
        min-height: 100vh;
        background: #fff;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 24px 16px;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 100;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 99;
      }
      .sidebar-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 8px 20px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 16px;
      }
      .sidebar-logo-icon {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: var(--primary);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-weight: 900;
        font-size: 18px;
      }
      .sidebar-logo-title {
        font-family: var(--font-display);
        font-weight: 900;
        font-size: 17px;
        color: var(--text-900);
      }
      .sidebar-logo-sub {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }
      .sidebar-section-label {
        font-size: 10px;
        font-weight: 700;
        color: var(--text-400);
        text-transform: uppercase;
        letter-spacing: 0.8px;
        padding: 0 12px;
        margin: 10px 0 4px;
      }
      .sidebar-nav {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 12px;
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 600;
        color: var(--text-500);
        cursor: pointer;
        transition: all 0.18s;
        border: none;
        background: transparent;
        width: 100%;
        text-align: left;
      }
      .nav-item:hover {
        background: var(--bg);
        color: var(--text-900);
      }
      .nav-item.active {
        background: var(--primary-light);
        color: var(--primary);
        font-weight: 700;
      }
      .nav-item svg {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
      }
      .sidebar-user-badge {
        border-radius: var(--radius-lg);
        padding: 14px 16px;
        color: white;
        margin-top: 12px;
      }
      .sidebar-logout {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 600;
        color: var(--text-400);
        cursor: pointer;
        transition: all 0.18s;
        border: none;
        background: transparent;
        width: 100%;
        text-align: left;
        margin-top: 8px;
      }
      .sidebar-logout:hover {
        color: var(--accent-red);
        background: #fee2e2;
      }

      /* MAIN */
      #main-content {
        margin-left: var(--sidebar-w);
        flex: 1;
        min-height: 100vh;
        padding: 36px 40px;
        overflow-x: hidden;
      }
      .page {
        animation: pageFadeIn 0.28s ease;
      }
      @keyframes pageFadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* CARDS */
      .card {
        background: var(--card-bg);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border);
        transition:
          box-shadow 0.2s,
          transform 0.2s;
      }
      .card-interactive {
        cursor: pointer;
      }
      .card-interactive:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }

      /* HERO */
      .hero-banner {
        border-radius: var(--radius-xl);
        padding: 32px 40px;
        color: white;
        position: relative;
        overflow: hidden;
        margin-bottom: 28px;
      }
      .hero-banner::after {
        content: "";
        position: absolute;
        right: -20px;
        top: -20px;
        width: 260px;
        height: 260px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 50%;
      }

      /* BUTTONS */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: none;
        cursor: pointer;
        font-family: var(--font-body);
        font-weight: 700;
        border-radius: 99px;
        transition: all 0.18s;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .btn-primary {
        background: var(--primary);
        color: white;
        padding: 12px 24px;
        font-size: 14px;
        box-shadow: var(--shadow-primary);
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }
      .btn-ghost {
        background: transparent;
        color: var(--primary);
        padding: 10px 20px;
        font-size: 14px;
        border: 1.5px solid var(--primary-light);
      }
      .btn-ghost:hover {
        background: var(--primary-light);
      }
      .btn-sm {
        padding: 8px 16px;
        font-size: 13px;
      }
      .btn-danger {
        background: #fef2f2;
        color: #b91c1c;
      }
      .btn-danger:hover {
        background: #fee2e2;
      }

      /* BADGE */
      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 99px;
        font-size: 11px;
        font-weight: 700;
        padding: 3px 10px;
      }
      .badge-blue {
        background: var(--primary-light);
        color: var(--primary);
      }
      .badge-green {
        background: #d1fae5;
        color: #065f46;
      }
      .badge-orange {
        background: #fef3c7;
        color: #92400e;
      }
      .badge-red {
        background: #fee2e2;
        color: #991b1b;
      }
      .badge-gray {
        background: var(--bg);
        color: var(--text-500);
      }
      .badge-purple {
        background: #f3e8ff;
        color: #6b21a8;
      }

      /* INPUTS */
      .bibo-input {
        width: 100%;
        padding: 12px 16px;
        border: 1.5px solid var(--border);
        border-radius: var(--radius-md);
        font-family: var(--font-body);
        font-size: 14px;
        font-weight: 500;
        color: var(--text-900);
        background: #fafafa;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .bibo-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(59, 63, 196, 0.1);
        background: white;
      }
      .bibo-input::placeholder {
        color: var(--text-400);
      }
      select.bibo-input {
        cursor: pointer;
      }
      textarea.bibo-input {
        resize: vertical;
        min-height: 80px;
      }
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: var(--text-500);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }
      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      /* TABLE */
      .data-table {
        width: 100%;
        border-collapse: collapse;
      }
      .data-table th {
        text-align: left;
        font-size: 11px;
        font-weight: 700;
        color: var(--text-400);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
      }
      .data-table td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
        color: var(--text-700);
      }
      .data-table tr:last-child td {
        border-bottom: none;
      }
      .data-table tr:hover td {
        background: #fafafa;
      }

      /* MODAL */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 17, 23, 0.5);
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        backdrop-filter: blur(4px);
        overflow-y: auto;
      }
      .modal {
        background: white;
        border-radius: var(--radius-xl);
        padding: 32px;
        width: 100%;
        max-width: 520px;
        box-shadow: var(--shadow-lg);
        animation: modalIn 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        margin: auto;
      }
      @keyframes modalIn {
        from {
          opacity: 0;
          transform: scale(0.96) translateY(10px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
      }
      .modal-title {
        font-family: var(--font-display);
        font-size: 20px;
        font-weight: 800;
        color: var(--text-900);
      }
      .modal-close {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--bg);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-400);
        font-size: 18px;
      }
      .modal-close:hover {
        background: #fee2e2;
        color: var(--accent-red);
      }

      /* TOAST */
      #toast {
        position: fixed;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%) translateY(16px);
        background: var(--text-900);
        color: white;
        padding: 12px 24px;
        border-radius: 99px;
        font-size: 13px;
        font-weight: 700;
        z-index: 9999;
        opacity: 0;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: none;
        white-space: nowrap;
      }
      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* SPINNER */
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid var(--border);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* STAT CARD */
      .stat-card {
        padding: 22px 24px;
      }
      .stat-label {
        font-size: 11px;
        font-weight: 700;
        color: var(--text-400);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
      }
      .stat-value {
        font-family: var(--font-display);
        font-size: 32px;
        font-weight: 900;
        color: var(--text-900);
        line-height: 1;
        margin-bottom: 4px;
      }

      /* SECTION HEADER */
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }
      .section-title {
        font-family: var(--font-display);
        font-size: 18px;
        font-weight: 800;
        color: var(--text-900);
      }

      /* UTILITY */
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .grid-3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .grid-4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
      }
      .flex-between {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .mb-16 {
        margin-bottom: 16px;
      }
      .mb-24 {
        margin-bottom: 24px;
      }
      .mb-32 {
        margin-bottom: 32px;
      }
      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      h1 {
        font-family: var(--font-display);
        font-size: 28px;
        font-weight: 900;
        color: var(--text-900);
        line-height: 1.2;
      }
      h3 {
        font-family: var(--font-display);
        font-size: 18px;
        font-weight: 800;
        color: var(--text-900);
      }

      /* MOBILE */
      #mobile-menu-btn {
        display: none;
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 101;
        width: 40px;
        height: 40px;
        border-radius: var(--radius-sm);
        background: white;
        border: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
        cursor: pointer;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 5px;
      }
      #mobile-menu-btn span {
        display: block;
        width: 18px;
        height: 2px;
        background: var(--text-700);
        border-radius: 99px;
      }
      @media (max-width: 900px) {
        #sidebar {
          transform: translateX(-100%);
        }
        #sidebar.open {
          transform: translateX(0);
        }
        #sidebar-overlay {
          display: block;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.3s;
        }
        #sidebar-overlay.open {
          opacity: 1;
          pointer-events: all;
        }
        #main-content {
          margin-left: 0;
          padding: 24px 20px;
          padding-top: 72px;
        }
        #mobile-menu-btn {
          display: flex;
        }
        .grid-4,
        .grid-3 {
          grid-template-columns: 1fr 1fr;
        }
        .field-row {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 600px) {
        .grid-4,
        .grid-3,
        .grid-2 {
          grid-template-columns: 1fr;
        }
      }

      /* PROGRESS BAR */
      .progress-track {
        background: var(--border);
        border-radius: 99px;
        height: 6px;
      }
      .progress-fill {
        height: 6px;
        border-radius: 99px;
        background: var(--primary);
        transition: width 0.5s ease;
      }
    </style>
  </head>
  <body>
    <button id="mobile-menu-btn" onclick="toggleSidebar()">
      <span></span><span></span><span></span>
    </button>
    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div id="toast"></div>

    <div id="app-layout">
      <nav id="sidebar">
        <div class="sidebar-logo">
          <div class="sidebar-logo-icon">B</div>
          <div>
            <div class="sidebar-logo-title">BIBO</div>
            <div
              class="sidebar-logo-sub"
              id="sidebar-role-label"
              style="color: var(--accent-orange)"
            >
              Portal
            </div>
          </div>
        </div>
        <div class="sidebar-nav" id="sidebar-nav-items"></div>
        <div
          class="sidebar-user-badge"
          id="sidebar-user-badge"
          style="background: linear-gradient(135deg, #1e2a78 0%, #3b3fc4 100%)"
        >
          <div
            style="
              font-size: 10px;
              font-weight: 700;
              letter-spacing: 0.8px;
              text-transform: uppercase;
              opacity: 0.7;
              margin-bottom: 4px;
            "
          >
            Logged in as
          </div>
          <div
            style="
              font-family: var(--font-display);
              font-size: 15px;
              font-weight: 800;
            "
            id="sidebar-username"
          >
            —
          </div>
          <div
            style="font-size: 11px; opacity: 0.75; margin-top: 2px"
            id="sidebar-role-display"
          >
            —
          </div>
        </div>
        <button class="sidebar-logout" onclick="logout()">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            width="16"
            height="16"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          Log Out
        </button>
      </nav>
      <div id="main-content">
        <div id="page-container"></div>
      </div>
    </div>

    <script>
      const API = "http://localhost:8080/api";
      let token = localStorage.getItem("bibo_admin_token") || null;
      let currentUser = JSON.parse(
        localStorage.getItem("bibo_admin_user") || "null",
      );
      let userRole = "";

      if (!token || !currentUser) {
        window.location.href = "admin_login.html";
      }

      // ── Determine Role ───────────────────────────────────────────
      userRole = String(
        currentUser?.role?.name ||
          currentUser?.roleName ||
          currentUser?.role ||
          "",
      ).toUpperCase();
      const isAdmin = userRole === "ADMIN";
      const isTeacher = userRole === "TEACHER";

      if (!isAdmin && !isTeacher) {
        alert(
          "Access denied. Only ADMIN or TEACHER accounts can access this portal.",
        );
        window.location.href = "admin_login.html";
      }

      // ── Setup Sidebar ────────────────────────────────────────────
      const username = currentUser?.username || currentUser?.name || "—";
      document.getElementById("sidebar-username").textContent = username;

      const ADMIN_NAV = [
        {
          id: "admin-dashboard",
          label: "Dashboard",
          icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
          section: "Main",
        },
        {
          id: "manage-accounts",
          label: "Manage Accounts",
          icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
          section: "Operations",
        },
        {
          id: "reports",
          label: "Reports",
          icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
          section: "Operations",
        },
        {
          id: "analytics",
          label: "Analytics",
          icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
          section: "Operations",
        },
        {
          id: "review-requests",
          label: "Review Requests",
          icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
          section: "Operations",
        },
        {
          id: "admin-settings",
          label: "Settings",

      async function apiFetch(method, path, body = null) {
        const headers = { "Content-Type": "application/json" };
        if (token) headers["Authorization"] = "Bearer " + token;
        const res = await fetch(API + path, {
          method,
          headers,
          body: body ? JSON.stringify(body) : null,
        });
        if (res.status === 401) {
          logout();
          return;
        }
        const data = await res.json().catch(() => ({}));
        if (!res.ok)

        return data;

          errEl.textContent = "Username, email and password are required.";
          errEl.style.display = "";
          return;
        }
        btn.disabled = true;

        try {
          await apiFetch("POST", "/admin/users", {
            firstName,
            lastName,
            username,
            email,

          errEl.style.display = "";

            return;
          }
          container.innerHTML = `<div class="card" style="overflow:hidden;"><table class="data-table"><thead><tr><th>Order</th><th>Title</th><th>Type</th><th>Content</th></tr></thead><tbody>
      ${sections.map((s) => `<tr><td>${s.contentOrder ?? "—"}</td><td>${s.title ?? "—"}</td><td>${s.contentType ?? "—"}</td><td>${s.content ?? "—"}</td></tr>`).join("")}
    </tbody></table></div>`;
        } catch (e) {
          container.innerHTML = `<div style="color:var(--accent-red);padding:16px;">⚠️ ${e.message}</div>`;
        }
      }

      // ── QUIZZES ───────────────────────────────────────────────────
      async function quizzes() {
        document.getElementById("page-container").innerHTML =
          `<div class="page">${PageHeader("Quizzes", "Create and manage lesson quizzes", "+ New Quiz", "openCreateQuiz()")}
    <div class="card" style="padding:20px;background:var(--primary-light);border-color:#dde2ff;margin-bottom:24px;"><div style="display:flex;align-items:flex-start;gap:12px;"><span style="font-size:22px;">💡</span><div><p style="font-weight:700;color:var(--primary);margin-bottom:4px;">Quiz Module</p><p style="font-size:13px;color:var(--text-500);">Quizzes are linked to lessons. Add multiple-choice questions with 4 choices each.</p></div></div></div>
    <div id="quizzes-list">${Loading()}</div>
  </div>`;
        try {
          const subs = await apiFetch("GET", "/subjects");
          let all = [];
          for (const s of subs || []) {
            try {
              const ls = await apiFetch("GET", `/lessons/subject/${s.id}`);
              for (const l of ls || []) {
                try {
                  const qs = await apiFetch("GET", `/quiz/lesson/${l.id}`);
                  if (qs?.length)
                    all.push(
                      ...qs.map((q) => ({
                        ...q,
                        lessonTitle: l.title,
                        subjectName: s.name,
                      })),
                    );
                } catch (e) {}
              }
            } catch (e) {}
          }
          if (!all.length) {
            document.getElementById("quizzes-list").innerHTML = Empty(
              "✅",
              "No quizzes yet",
              'Click "+ New Quiz" to create your first quiz.',
            );
            return;
          }
          document.getElementById("quizzes-list").innerHTML =
            `<div class="card" style="overflow:hidden;"><table class="data-table"><thead><tr><th>Quiz Title</th><th>Lesson</th><th>Subject</th><th>Passing Score</th><th>Questions</th></tr></thead><tbody>
      ${all
        .map((q) => {
          const st = getSubjectStyle(q.subjectName);
          return `<tr><td><div style="font-weight:700;color:var(--text-900);">${q.title}</div><div style="font-size:12px;color:var(--text-400);">${q.description || "—"}</div></td><td style="font-size:13px;">${q.lessonTitle}</td><td><span style="display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:${st.color};">${st.icon} ${q.subjectName}</span></td><td><span class="badge badge-blue">${q.passingScore}%</span></td><td style="font-size:13px;color:var(--text-500);">${q.questions?.length || 0} questions</td></tr>`;
        })
        .join("")}
    </tbody></table></div>`;
        } catch (e) {
          document.getElementById("quizzes-list").innerHTML =
            `<div style="color:var(--accent-red);padding:20px;">⚠️ ${e.message}</div>`;
        }
      }

      let _qCount = 0;
      async function openCreateQuiz() {
        _qCount = 0;
        let opts = '<option value="">Select lesson...</option>';
        try {
          const subs = await apiFetch("GET", "/subjects");
          for (const s of subs || []) {
            try {
              const ls = await apiFetch("GET", `/lessons/subject/${s.id}`);
              if (ls?.length) {
                opts += `<optgroup label="${s.name}">`;
                opts += ls
                  .map((l) => `<option value="${l.id}">${l.title}</option>`)
                  .join("");
                opts += `</optgroup>`;
              }
            } catch (e) {}
          }
        } catch (e) {}
        openModal(`<div class="modal-header"><div class="modal-title">✅ New Quiz</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div id="qz-err" style="display:none;background:#FEE2E2;color:#991B1B;font-size:13px;font-weight:700;padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:14px;"></div>
    <div class="field"><label>Lesson</label><select id="qz-lesson" class="bibo-input">${opts}</select></div>
    <div class="field"><label>Quiz Title</label><input id="qz-title" class="bibo-input" placeholder="e.g. Fractions Quiz" /></div>
    <div class="field"><label>Description</label><input id="qz-desc" class="bibo-input" placeholder="Optional" /></div>
    <div class="field"><label>Passing Score (%)</label><input id="qz-passing" class="bibo-input" type="number" value="75" min="0" max="100" /></div>
    <div style="border-top:1px solid var(--border);margin:16px 0;padding-top:16px;"><p style="font-size:13px;font-weight:700;color:var(--text-900);margin-bottom:4px;">Questions</p><p style="font-size:12px;color:var(--text-400);margin-bottom:14px;">Mark the correct answer with the radio button.</p><div id="qz-questions"></div><button class="btn btn-ghost btn-sm" onclick="addQuestion()" style="width:100%;margin-top:8px;">+ Add Question</button></div>
    <div style="display:flex;gap:10px;margin-top:8px;"><button class="btn btn-ghost" style="flex:1;" onclick="closeModal()">Cancel</button><button class="btn btn-primary" style="flex:1;" id="qz-btn" onclick="submitQuiz()">Create Quiz</button></div>`);
        addQuestion();
      }
      function addQuestion() {
        _qCount++;
        const n = _qCount;
        const el = document.createElement("div");
        el.id = `qb-${n}`;
        el.style.cssText =
          "background:var(--bg);border-radius:var(--radius-md);padding:16px;margin-bottom:12px;";
        el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><span style="font-size:13px;font-weight:700;color:var(--text-700);">Question ${n}</span>${n > 1 ? `<button style="background:none;border:none;cursor:pointer;color:var(--accent-red);font-size:12px;font-weight:700;" onclick="document.getElementById('qb-${n}').remove()">Remove</button>` : ""}</div>
    <input class="bibo-input" id="qt-${n}" placeholder="Enter question text..." style="margin-bottom:8px;" />
    ${["A", "B", "C", "D"].map((k, i) => `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><input type="radio" name="cr-${n}" value="${i}" id="r-${n}-${i}" style="accent-color:var(--primary);width:16px;height:16px;flex-shrink:0;" /><label for="r-${n}-${i}" style="font-size:12px;font-weight:700;color:var(--text-400);width:16px;">${k}</label><input class="bibo-input" id="ch-${n}-${i}" placeholder="Choice ${k}..." style="flex:1;padding:9px 12px;" /></div>`).join("")}
    <p style="font-size:11px;color:var(--text-400);margin-top:4px;">Select the radio next to the correct answer.</p>`;
        document.getElementById("qz-questions").appendChild(el);
      }
      async function submitQuiz() {
        const lessonId = document.getElementById("qz-lesson").value,
          title = document.getElementById("qz-title").value.trim(),
          desc = document.getElementById("qz-desc").value.trim(),
          passingScore =
            parseInt(document.getElementById("qz-passing").value) || 75,
          errEl = document.getElementById("qz-err");
        if (!lessonId) {
          errEl.textContent = "Select a lesson.";
          errEl.style.display = "";
          return;
        }
        if (!title) {
          errEl.textContent = "Quiz title required.";
          errEl.style.display = "";
          return;
        }
        const questions = [];
        const blocks = document.querySelectorAll('[id^="qb-"]');
        for (const block of blocks) {
          const n = block.id.replace("qb-", "");
          const qt = document.getElementById(`qt-${n}`)?.value.trim();
          if (!qt) {
            errEl.textContent = `Question ${n} text required.`;
            errEl.style.display = "";
            return;
          }
          const correct = block.querySelector(`input[name="cr-${n}"]:checked`);
          if (!correct) {
            errEl.textContent = `Mark correct answer for Question ${n}.`;
            errEl.style.display = "";
            return;
          }
          const correctIdx = parseInt(correct.value);
          const choices = [0, 1, 2, 3].map((i) => {
            const t = document.getElementById(`ch-${n}-${i}`)?.value.trim();
            if (!t) return null;
            return { choiceText: t, correct: i === correctIdx };
          });
          if (choices.some((c) => !c)) {
            errEl.textContent = `All 4 choices required for Question ${n}.`;
            errEl.style.display = "";
            return;
          }
          questions.push({ questionText: qt, choices });
        }
        if (!questions.length) {
          errEl.textContent = "Add at least one question.";
          errEl.style.display = "";
          return;
        }
        const btn = document.getElementById("qz-btn");
        btn.disabled = true;
        btn.textContent = "Creating...";
        try {
          await apiFetch("POST", "/quiz/create", {
            lessonId: parseInt(lessonId),
            title,
            description: desc,
            passingScore,
            questions,
          });
          closeModal();
          showToast("Quiz created!", "✅");
          await quizzes();
        } catch (e) {
          errEl.textContent = e.message;
          errEl.style.display = "";
          btn.disabled = false;
          btn.textContent = "Create Quiz";
        }
      }

      // ── STUDENTS ──────────────────────────────────────────────────
      async function students() {
        document.getElementById("page-container").innerHTML =
          `<div class="page">${PageHeader("Students", "View registered student accounts", "", "")}
    <div class="card" style="padding:20px;background:var(--primary-light);border-color:#dde2ff;margin-bottom:24px;"><div style="display:flex;align-items:flex-start;gap:12px;"><span style="font-size:22px;">ℹ️</span><div><p style="font-weight:700;color:var(--primary);margin-bottom:4px;">Student Accounts</p><p style="font-size:13px;color:var(--text-500);">Students register through the main BIBO app. Their accounts appear here once registered.</p></div></div></div>
    <div id="students-list">${Loading()}</div>
  </div>`;
        try {
          const data = await apiFetch("GET", "/student/all");
          if (!Array.isArray(data) || data.length === 0) {
            document.getElementById("students-list").innerHTML = Empty(
              "👥",
              "No students yet",
              "Students appear here after registering through the BIBO app.",
            );
            return;
          }
          document.getElementById("students-list").innerHTML =
            `<div class="card" style="overflow:hidden;"><table class="data-table"><thead><tr><th>Student</th><th>Username</th><th>Level</th><th>Joined</th></tr></thead><tbody>
      ${data.map((s) => `<tr><td><div style="display:flex;align-items:center;gap:10px;"><div style="width:36px;height:36px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--primary);font-size:14px;">${((s.fullName || s.username || "?").trim()[0] || "?").toUpperCase()}</div><span style="font-weight:600;">${s.fullName || s.name || "—"}</span></div></td><td style="color:var(--text-400);">@${s.username || "—"}</td><td><span class="badge badge-blue">${s.learningLevel || s.level || "BEGINNER"}</span></td><td style="font-size:13px;color:var(--text-400);">${s.createdAt ? new Date(s.createdAt).toLocaleDateString() : "—"}</td></tr>`).join("")}
    </tbody></table></div>`;
        } catch (e) {
          document.getElementById("students-list").innerHTML =
            `<div class="card" style="padding:16px;color:var(--accent-red);">⚠️ Failed to load students: ${e.message}</div>`;
        }
      }

      // ── Init ─────────────────────────────────────────────────────
      navigate(isAdmin ? "admin-dashboard" : "teacher-dashboard");
    </script>
  </body>
</html>
