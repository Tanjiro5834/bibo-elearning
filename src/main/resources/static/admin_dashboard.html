<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIBO Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #EAECF0; --card-bg: #FFFFFF; --primary: #3B3FC4; --primary-dark: #2E31A8;
      --primary-light: #EEF0FF; --primary-mid: #6366F1; --accent-orange: #F59E0B;
      --accent-green: #10B981; --accent-red: #EF4444; --text-900: #0F1117;
      --text-700: #374151; --text-500: #6B7280; --text-400: #9CA3AF; --border: #E5E7EB;
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.06); --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.12); --shadow-primary: 0 4px 20px rgba(59,63,196,0.28);
      --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-xl: 24px;
      --sidebar-w: 260px; --font-display: 'Plus Jakarta Sans', sans-serif; --font-body: 'DM Sans', sans-serif;
    }
    html,body { font-family: var(--font-body); background: var(--bg); color: var(--text-700); min-height: 100vh; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 99px; }

    #app-layout { display: flex; min-height: 100vh; }

    /* SIDEBAR */
    #sidebar {
      width: var(--sidebar-w); min-height: 100vh; background: #fff;
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      padding: 24px 16px; position: fixed; top:0; left:0; bottom:0; z-index:100;
      transition: transform 0.3s cubic-bezier(.4,0,.2,1);
    }
    #sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:99; }
    .sidebar-logo { display:flex; align-items:center; gap:10px; padding:4px 8px 20px; border-bottom:1px solid var(--border); margin-bottom:16px; }
    .sidebar-logo-icon { width:40px; height:40px; border-radius:10px; background:var(--primary); color:white; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:900; font-size:18px; }
    .sidebar-logo-title { font-family:var(--font-display); font-weight:900; font-size:17px; color:var(--text-900); }
    .sidebar-logo-sub { font-size:10px; font-weight:700; color:var(--accent-orange); letter-spacing:0.8px; text-transform:uppercase; }
    .sidebar-section-label { font-size:10px; font-weight:700; color:var(--text-400); text-transform:uppercase; letter-spacing:0.8px; padding:0 12px; margin:10px 0 4px; }
    .sidebar-nav { flex:1; display:flex; flex-direction:column; gap:2px; }
    .nav-item { display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:var(--radius-sm); font-size:14px; font-weight:600; color:var(--text-500); cursor:pointer; transition:all 0.18s; border:none; background:transparent; width:100%; text-align:left; }
    .nav-item:hover { background:var(--bg); color:var(--text-900); }
    .nav-item.active { background:var(--primary-light); color:var(--primary); font-weight:700; }
    .nav-item svg { flex-shrink:0; width:18px; height:18px; }
    .sidebar-admin-badge { background:linear-gradient(135deg,#1E2A78 0%,#3B3FC4 100%); border-radius:var(--radius-lg); padding:14px 16px; color:white; margin-top:12px; }
    .sidebar-logout { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; color:var(--text-400); cursor:pointer; transition:all 0.18s; border:none; background:transparent; width:100%; text-align:left; margin-top:8px; }
    .sidebar-logout:hover { color:var(--accent-red); background:#FEE2E2; }

    /* MAIN */
    #main-content { margin-left:var(--sidebar-w); flex:1; min-height:100vh; padding:36px 40px; overflow-x:hidden; }
    .page { animation:pageFadeIn 0.28s ease; }
    @keyframes pageFadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    /* CARDS */
    .card { background:var(--card-bg); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); border:1px solid var(--border); transition:box-shadow 0.2s,transform 0.2s; }
    .card-interactive { cursor:pointer; }
    .card-interactive:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); }

    /* HERO */
    .hero-banner { background:linear-gradient(135deg,#1E2A78 0%,#3B3FC4 60%,#5B60E0 100%); border-radius:var(--radius-xl); padding:32px 40px; color:white; position:relative; overflow:hidden; margin-bottom:28px; }
    .hero-banner::after { content:''; position:absolute; right:-20px; top:-20px; width:260px; height:260px; background:rgba(255,255,255,0.05); border-radius:50%; }

    /* BUTTONS */
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; cursor:pointer; font-family:var(--font-body); font-weight:700; border-radius:99px; transition:all 0.18s; }
    .btn:disabled { opacity:0.6; cursor:not-allowed; }
    .btn-primary { background:var(--primary); color:white; padding:12px 24px; font-size:14px; box-shadow:var(--shadow-primary); }
    .btn-primary:hover:not(:disabled) { background:var(--primary-dark); transform:translateY(-1px); }
    .btn-ghost { background:transparent; color:var(--primary); padding:10px 20px; font-size:14px; border:1.5px solid var(--primary-light); }
    .btn-ghost:hover { background:var(--primary-light); }
    .btn-sm { padding:8px 16px; font-size:13px; }

    /* BADGE */
    .badge { display:inline-flex; align-items:center; border-radius:99px; font-size:11px; font-weight:700; padding:3px 10px; }
    .badge-blue { background:var(--primary-light); color:var(--primary); }
    .badge-green { background:#D1FAE5; color:#065F46; }
    .badge-orange { background:#FEF3C7; color:#92400E; }
    .badge-red { background:#FEE2E2; color:#991B1B; }
    .badge-gray { background:var(--bg); color:var(--text-500); }

    /* INPUTS */
    .bibo-input { width:100%; padding:12px 16px; border:1.5px solid var(--border); border-radius:var(--radius-md); font-family:var(--font-body); font-size:14px; font-weight:500; color:var(--text-900); background:#FAFAFA; outline:none; transition:border-color 0.2s,box-shadow 0.2s; }
    .bibo-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(59,63,196,0.1); background:white; }
    .bibo-input::placeholder { color:var(--text-400); }
    select.bibo-input { cursor:pointer; }
    textarea.bibo-input { resize:vertical; min-height:80px; }
    .field { margin-bottom:14px; }
    .field label { display:block; font-size:12px; font-weight:700; color:var(--text-500); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
    .field-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

    /* TABLE */
    .data-table { width:100%; border-collapse:collapse; }
    .data-table th { text-align:left; font-size:11px; font-weight:700; color:var(--text-400); text-transform:uppercase; letter-spacing:0.5px; padding:10px 16px; border-bottom:1px solid var(--border); }
    .data-table td { padding:14px 16px; border-bottom:1px solid var(--border); font-size:14px; color:var(--text-700); }
    .data-table tr:last-child td { border-bottom:none; }
    .data-table tr:hover td { background:#FAFAFA; }

    /* MODAL */
    .modal-overlay { position:fixed; inset:0; background:rgba(15,17,23,0.5); z-index:200; display:flex; align-items:center; justify-content:center; padding:24px; backdrop-filter:blur(4px); overflow-y:auto; }
    .modal { background:white; border-radius:var(--radius-xl); padding:32px; width:100%; max-width:520px; box-shadow:var(--shadow-lg); animation:modalIn 0.22s cubic-bezier(.4,0,.2,1); margin:auto; }
    @keyframes modalIn { from{opacity:0;transform:scale(0.96) translateY(10px)} to{opacity:1;transform:scale(1) translateY(0)} }
    .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
    .modal-title { font-family:var(--font-display); font-size:20px; font-weight:800; color:var(--text-900); }
    .modal-close { width:32px; height:32px; border-radius:50%; background:var(--bg); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text-400); font-size:18px; }
    .modal-close:hover { background:#FEE2E2; color:var(--accent-red); }

    /* TOAST */
    #toast { position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(16px); background:var(--text-900); color:white; padding:12px 24px; border-radius:99px; font-size:13px; font-weight:700; z-index:9999; opacity:0; transition:all 0.3s cubic-bezier(.4,0,.2,1); pointer-events:none; white-space:nowrap; }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* SPINNER */
    .spinner { width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 0.7s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* STAT CARD */
    .stat-card { padding:22px 24px; }
    .stat-label { font-size:11px; font-weight:700; color:var(--text-400); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; }
    .stat-value { font-family:var(--font-display); font-size:32px; font-weight:900; color:var(--text-900); line-height:1; margin-bottom:4px; }

    /* SECTION HEADER */
    .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .section-title { font-family:var(--font-display); font-size:18px; font-weight:800; color:var(--text-900); }

    /* UTILITY */
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
    .grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
    .flex-between { display:flex; align-items:center; justify-content:space-between; }
    .mb-16 { margin-bottom:16px; } .mb-24 { margin-bottom:24px; } .mb-32 { margin-bottom:32px; }
    .truncate { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    h1 { font-family:var(--font-display); font-size:28px; font-weight:900; color:var(--text-900); line-height:1.2; }
    h3 { font-family:var(--font-display); font-size:18px; font-weight:800; color:var(--text-900); }

    /* MOBILE */
    #mobile-menu-btn { display:none; position:fixed; top:16px; left:16px; z-index:101; width:40px; height:40px; border-radius:var(--radius-sm); background:white; border:1px solid var(--border); box-shadow:var(--shadow-sm); cursor:pointer; align-items:center; justify-content:center; flex-direction:column; gap:5px; }
    #mobile-menu-btn span { display:block; width:18px; height:2px; background:var(--text-700); border-radius:99px; }
    @media(max-width:900px) {
      #sidebar { transform:translateX(-100%); }
      #sidebar.open { transform:translateX(0); }
      #sidebar-overlay { display:block; opacity:0; pointer-events:none; transition:opacity 0.3s; }
      #sidebar-overlay.open { opacity:1; pointer-events:all; }
      #main-content { margin-left:0; padding:24px 20px; padding-top:72px; }
      #mobile-menu-btn { display:flex; }
      .grid-4,.grid-3 { grid-template-columns:1fr 1fr; }
      .field-row { grid-template-columns:1fr; }
    }
    @media(max-width:600px) { .grid-4,.grid-3,.grid-2 { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<button id="mobile-menu-btn" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
<div id="sidebar-overlay" onclick="toggleSidebar()"></div>
<div id="toast"></div>

<div id="app-layout">
  <nav id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">B</div>
      <div>
        <div class="sidebar-logo-title">BIBO</div>
        <div class="sidebar-logo-sub">Admin Portal</div>
      </div>
    </div>

    <div class="sidebar-nav">
      <div class="sidebar-section-label">Main</div>
      <button class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </button>

      <div class="sidebar-section-label" style="margin-top:8px;">Content</div>
      <button class="nav-item" data-page="subjects" onclick="navigate('subjects')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        Subjects
      </button>
      <button class="nav-item" data-page="lessons" onclick="navigate('lessons')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Lessons
      </button>
      <button class="nav-item" data-page="sections" onclick="navigate('sections')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        Sections
      </button>
      <button class="nav-item" data-page="quizzes" onclick="navigate('quizzes')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Quizzes
      </button>

      <div class="sidebar-section-label" style="margin-top:8px;">Users</div>
      <button class="nav-item" data-page="students" onclick="navigate('students')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Students
      </button>
    </div>

    <div class="sidebar-admin-badge">
      <div style="font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;opacity:0.7;margin-bottom:4px;">Logged in as</div>
      <div style="font-family:var(--font-display);font-size:15px;font-weight:800;" id="sidebar-admin-name">Admin</div>
      <div style="font-size:11px;opacity:0.75;margin-top:2px;">🛡️ Administrator</div>
    </div>

    <button class="sidebar-logout" onclick="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Log Out
    </button>
  </nav>

  <div id="main-content">
    <div id="page-container"></div>
  </div>
</div>

<script>
const API = 'http://localhost:8080/api';
let token = localStorage.getItem('bibo_admin_token') || null;
let adminUser = JSON.parse(localStorage.getItem('bibo_admin_user') || 'null');

if (!token) window.location.href = 'admin_login.html';

const adminName = adminUser?.username || adminUser?.name || 'Admin';
document.getElementById('sidebar-admin-name').textContent = adminName;

// ── Data Maps (avoid inline JSON in onclick) ─────────────────────────────────
window._subjectMap = {};
window._lessonMap  = {};

// ── API ─────────────────────────────────────
async function apiFetch(method, path, body = null) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : null });
  if (res.status === 401) { logout(); return; }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || data.error || `HTTP ${res.status}`);
  return data;
}

// ── Router ──────────────────────────────────
function navigate(page) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  ({ dashboard, subjects, lessons, sections, quizzes, students })[page]?.();
  const s = document.getElementById('sidebar');
  if (s.classList.contains('open')) toggleSidebar();
  window.scrollTo(0, 0);
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}

function logout() {
  localStorage.removeItem('bibo_admin_token');
  localStorage.removeItem('bibo_admin_user');
  window.location.href = 'admin_login.html';
}

// ── Toast ────────────────────────────────────
function showToast(msg, emoji = '✅') {
  const t = document.getElementById('toast');
  t.textContent = `${emoji} ${msg}`;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ── Helpers ──────────────────────────────────
function Loading() {
  return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px;">
    <div class="spinner"></div><p style="color:var(--text-400);font-size:13px;font-weight:600;">Loading...</p></div>`;
}
function Empty(emoji, title, sub) {
  return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;text-align:center;">
    <div style="font-size:44px;">${emoji}</div><h3>${title}</h3>
    <p style="color:var(--text-400);font-size:13px;">${sub}</p></div>`;
}
function PageHeader(title, sub, btnLabel, btnFn) {
  return `<div class="flex-between mb-32">
    <div><h1 style="font-size:26px;margin-bottom:4px;">${title}</h1><p style="color:var(--text-400);font-size:14px;">${sub}</p></div>
    ${btnLabel ? `<button class="btn btn-primary" onclick="${btnFn}">${btnLabel}</button>` : ''}
  </div>`;
}
function openModal(html) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'active-modal';
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
}
function closeModal() { document.getElementById('active-modal')?.remove(); }

const SUBJECT_STYLES = {
  'Math':    { color: '#3B3FC4', pale: '#EEF0FF',  icon: '🔢' },
  'Science': { color: '#0D9488', pale: '#CCFBF1',  icon: '🔬' },
  'English': { color: '#3B3FC4', pale: '#EEF0FF',  icon: '📘' },
  'Filipino':{ color: '#EF4444', pale: '#FEE2E2',  icon: '🇵🇭' },
  'Arts':    { color: '#EC4899', pale: '#FCE7F3',  icon: '🎨' },
  'Values':  { color: '#10B981', pale: '#D1FAE5',  icon: '🌟' },
  'default': { color: '#3B3FC4', pale: '#EEF0FF',  icon: '📚' },
};
const getSubjectStyle = n => SUBJECT_STYLES[n] || SUBJECT_STYLES['default'];

// ═══════════════════════════════════════════
// PAGE: DASHBOARD
// ═══════════════════════════════════════════
async function dashboard() {
  document.getElementById('page-container').innerHTML = `<div class="page">
    <div class="hero-banner">
      <div style="position:relative;z-index:1;">
        <p style="font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:0.7;margin-bottom:8px;">🛡️ Admin Control Panel</p>
        <h1 style="color:white;font-size:30px;font-weight:900;margin-bottom:8px;">Welcome back, ${adminName}!</h1>
        <p style="color:rgba(255,255,255,0.75);font-size:14px;margin-bottom:22px;">Manage BIBO's content and keep learners engaged.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn" style="background:rgba(255,255,255,0.15);color:white;padding:10px 18px;font-size:13px;border:1px solid rgba(255,255,255,0.2);" onclick="openCreateSubject()">+ New Subject</button>
          <button class="btn" style="background:rgba(255,255,255,0.15);color:white;padding:10px 18px;font-size:13px;border:1px solid rgba(255,255,255,0.2);" onclick="navigate('lessons');setTimeout(openCreateLesson,100)">+ New Lesson</button>
          <button class="btn" style="background:rgba(255,255,255,0.15);color:white;padding:10px 18px;font-size:13px;border:1px solid rgba(255,255,255,0.2);" onclick="navigate('sections');setTimeout(openCreateSection,100)">+ New Section</button>
        </div>
      </div>
    </div>

    <div class="grid-4 mb-32" id="dash-stats">
      ${[1,2,3,4].map(() => `<div class="card stat-card"><div class="spinner" style="margin:8px 0;"></div></div>`).join('')}
    </div>

    <div class="section-header">
      <span class="section-title">Quick Actions</span>
    </div>
    <div class="grid-3 mb-32">
      ${[
        { icon: '📚', label: 'Manage Subjects', sub: 'Add and edit curriculum subjects', page: 'subjects' },
        { icon: '📝', label: 'Manage Lessons',  sub: 'Create lessons inside subjects',   page: 'lessons'  },
        { icon: '✅', label: 'Manage Quizzes',  sub: 'Build quizzes for each lesson',    page: 'quizzes'  },
      ].map(a => `
        <div class="card card-interactive" style="padding:24px;" onclick="navigate('${a.page}')">
          <div style="width:52px;height:52px;border-radius:14px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:14px;">${a.icon}</div>

      document.getElementById('dash-subjects').innerHTML = Empty('📭', 'No subjects yet', 'Create your first subject to get started.');

    subjectList.forEach(s => { window._subjectMap[s.id] = s; });

    document.getElementById('dash-subjects').innerHTML = `
      <div style="display:flex;flex-direction:column;gap:10px;">
        ${subjectList.slice(0, 5).map(s => {
          const st = getSubjectStyle(s.name);
          return `<div class="card" style="padding:16px;display:flex;align-items:center;gap:14px;">
            <div style="width:44px;height:44px;border-radius:12px;background:${st.pale};display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;">${st.icon}</div>
            <div style="flex:1;min-width:0;">

              <div style="font-size:13px;color:var(--text-400);" class="truncate">${s.description || '—'}</div>
            </div>
            <span class="badge badge-green">Active</span>
            <button class="btn btn-ghost btn-sm" onclick="openSubjectLessons(${s.id})">Lessons</button>
          </div>`;
        }).join('')}
      </div>`;
  } catch (e) {
    document.getElementById('dash-stats').innerHTML = `<div style="color:var(--accent-red);padding:16px;grid-column:1/-1;">⚠️ Could not load stats: ${e.message}</div>`;
  }
}

// Safe: accepts ID only, reads data from map
function openEditSubject(subjectId) {

  const safeName = (subject.name        || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;');

  openModal(`

      <button class="modal-close" onclick="closeModal()">✕</button>

      <label>Subject Name</label>
      <input id="esub-name" class="bibo-input" value="${safeName}" />

      <button class="btn btn-ghost" style="flex:1;" onclick="closeModal()">Cancel</button>

async function submitEditSubject(id) {
  const name        = document.getElementById('esub-name').value.trim();
  const description = document.getElementById('esub-desc').value.trim();

async function lessons(subjectId = null, subjectName = null) {
  document.getElementById('page-container').innerHTML = `<div class="page">
    ${PageHeader(
      subjectName ? `Lessons • ${subjectName}` : 'Lessons',
      subjectName ? `Manage lessons for ${subjectName}` : 'Create and manage all lessons',
      '+ New Lesson',
      'openCreateLesson()'
    )}
    <div id="lessons-list">${Loading()}</div>
  </div>`;
  await loadLessons(subjectId, subjectName);
}

async function loadLessons(subjectId = null, subjectName = null) {
  try {
    let all = [];

    if (subjectId) {
      const ls = await apiFetch('GET', `/lessons/subject/${subjectId}`);
      all = (ls || []).map(l => ({ ...l, subjectName: subjectName || l.subjectName || '—' }));
    } else {
      const subs = await apiFetch('GET', '/subjects');
      if (!subs?.length) {
        document.getElementById('lessons-list').innerHTML = Empty('📝', 'No subjects yet', 'Create a subject first.');
        return;
      }
      await Promise.all(subs.map(async s => {
        try {
          const ls = await apiFetch('GET', `/lessons/subject/${s.id}`);
          if (ls?.length) all.push(...ls.map(l => ({ ...l, subjectName: s.name })));
        } catch (e) {}
      }));
    }

    if (!all.length) {
      document.getElementById('lessons-list').innerHTML = Empty('📝', 'No lessons yet', 'Click "+ New Lesson" to add one.');
      return;
    }

    // Populate lesson map
    window._lessonMap = {};
    all.forEach(l => { window._lessonMap[l.id] = l; });

    const diffClass = { EASY: 'badge-green', MEDIUM: 'badge-orange', HARD: 'badge-red' };

    document.getElementById('lessons-list').innerHTML = `
      <div class="card" style="overflow:hidden;">
        <table class="data-table">
          <thead>
            <tr>
              <th>Lesson</th><th>Subject</th><th>Difficulty</th><th>Duration</th><th>Status</th>
              <th style="text-align:right;">Actions</th>
            </tr>
          </thead>
          <tbody>
            ${all.map(l => {
              const st         = getSubjectStyle(l.subjectName);
              const difficulty = l.learningLevel || l.difficultyLevel || 'Beginner';
              const diffKey    = difficulty.toUpperCase();
              return `
                <tr>
                  <td>
                    <div style="font-weight:700;color:var(--text-900);">${l.title}</div>
                    <div style="font-size:12px;color:var(--text-400);margin-top:2px;">${l.description || '—'}</div>
                  </td>
                  <td>
                    <span style="display:inline-flex;align-items:center;gap:6px;">
                      <span style="font-size:15px;">${st.icon}</span>
                      <span style="font-size:13px;font-weight:600;color:${st.color};">${l.subjectName}</span>
                    </span>
                  </td>
                  <td><span class="badge ${diffClass[diffKey] || 'badge-gray'}">${difficulty}</span></td>
                  <td style="font-size:13px;color:var(--text-400);">${l.estimatedMinutes ? l.estimatedMinutes + ' min' : '—'}</td>
                  <td>
                    <span class="badge ${l.published ? 'badge-green' : 'badge-orange'}">${l.published ? 'Published' : 'Draft'}</span>
                  </td>
                  <td style="text-align:right;">
                    <div style="display:flex;gap:8px;justify-content:flex-end;">
                      <button class="btn btn-ghost btn-sm" onclick="navigate('sections')">Sections</button>
                      <button class="btn btn-sm" style="background:var(--bg);color:var(--text-500);" onclick="openEditLesson(${l.id})">Edit</button>
                    </div>
                  </td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  } catch (e) {
    document.getElementById('lessons-list').innerHTML = `<div style="color:var(--accent-red);padding:20px;">⚠️ ${e.message}</div>`;
  }
}

async function openCreateLesson() {
  let opts = '<option value="">Select subject...</option>';
  try {
    const subs = await apiFetch('GET', '/subjects');
    opts += (subs || []).map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  } catch (e) {}

  openModal(`
    <div class="modal-header"><div class="modal-title">📝 New Lesson</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div id="les-err" style="display:none;background:#FEE2E2;color:#991B1B;font-size:13px;font-weight:700;padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:14px;"></div>
    <div class="field"><label>Subject</label><select id="les-subject" class="bibo-input">${opts}</select></div>
    <div class="field"><label>Lesson Title</label><input id="les-title" class="bibo-input" placeholder="e.g. Introduction to Fractions" /></div>
    <div class="field"><label>Description</label><textarea id="les-desc" class="bibo-input" placeholder="What will students learn?"></textarea></div>
    <div class="field-row">
      <div class="field" style="margin-bottom:0;"><label>Minutes</label><input id="les-minutes" class="bibo-input" type="number" placeholder="30" /></div>
      <div class="field" style="margin-bottom:0;"><label>Difficulty</label>
        <select id="les-diff" class="bibo-input"><option value="EASY">Easy</option><option value="MEDIUM">Medium</option><option value="HARD">Hard</option></select>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:18px;">
      <button class="btn btn-ghost" style="flex:1;" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="flex:1;" id="les-btn" onclick="submitLesson()">Create Lesson</button>
    </div>`);
}

async function submitLesson() {
  const subjectId = document.getElementById('les-subject').value;
  const title     = document.getElementById('les-title').value.trim();
  const desc      = document.getElementById('les-desc').value.trim();
  const minutes   = parseInt(document.getElementById('les-minutes').value) || null;
  const diff      = document.getElementById('les-diff').value;
  const errEl     = document.getElementById('les-err');
  if (!subjectId) { errEl.textContent = 'Select a subject.'; errEl.style.display = ''; return; }
  if (!title)     { errEl.textContent = 'Lesson title required.'; errEl.style.display = ''; return; }
  const btn = document.getElementById('les-btn'); btn.disabled = true; btn.textContent = 'Creating...';
  try {
    await apiFetch('POST', '/lessons', { subjectId: parseInt(subjectId), title, description: desc, estimatedMinutes: minutes, difficultyLevel: diff, published: true });
    closeModal(); showToast('Lesson created!', '📝');
    await loadLessons();
  } catch (e) {
    errEl.textContent = e.message; errEl.style.display = '';
    btn.disabled = false; btn.textContent = 'Create Lesson';
  }
}

async function sections() {
  document.getElementById('page-container').innerHTML = `<div class="page">
    ${PageHeader('Lesson Sections', 'Add content blocks to lessons', '+ New Section', 'openCreateSection()')}

    <div class="card" style="padding:20px;background:var(--primary-light);border-color:#dde2ff;margin-bottom:24px;">
      <div style="display:flex;align-items:flex-start;gap:12px;">
        <span style="font-size:22px;">💡</span>
        <div>
          <p style="font-weight:700;color:var(--primary);margin-bottom:4px;">How Sections Work</p>
          <p style="font-size:13px;color:var(--text-500);">
            Each section is a content block inside a lesson. Add sections in order — they appear sequentially to students.
            Supported types: Text, Image, Video, Activity.
          </p>
        </div>
      </div>
    </div>

    <div class="field" style="margin-bottom:18px;">
      <label>Select Lesson</label>
      <select id="sections-lesson-filter" class="bibo-input">
        <option value="">Select lesson</option>
      </select>
    </div>

    <div id="sections-content">${Empty('📄', 'Select a lesson', 'Choose a lesson to view its sections.')}</div>
  </div>`;

  const select = document.getElementById('sections-lesson-filter');
  let options = '<option value="">Select lesson</option>';

  try {
    const subs = await apiFetch('GET', '/subjects');

    for (const s of (subs || [])) {
      try {
        const ls = await apiFetch('GET', `/lessons/subject/${s.id}`);
        if (ls?.length) {
          options += `<optgroup label="${s.name}">`;
          options += ls.map(l => `<option value="${l.id}">${l.title}</option>`).join('');
          options += `</optgroup>`;
        }
      } catch (e) {}
    }

    select.innerHTML = options;

    select.addEventListener('change', async function () {
      const lessonId = parseInt(this.value);
      if (!lessonId) {
        document.getElementById('sections-content').innerHTML =
          Empty('📄', 'Select a lesson', 'Choose a lesson to view its sections.');
        return;

      await loadSections(lessonId);
    });
  } catch (e) {
    document.getElementById('sections-content').innerHTML =
      `<div style="color:var(--accent-red);padding:16px;">⚠️ ${e.message}</div>`;
  }
}

    <div class="modal-header"><div class="modal-title">📄 New Section</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div id="sec-err" style="display:none;background:#FEE2E2;color:#991B1B;font-size:13px;font-weight:700;padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:14px;"></div>
    <div class="field"><label>Lesson</label><select id="sec-lesson" class="bibo-input">${opts}</select></div>
    <div class="field"><label>Section Title</label><input id="sec-title" class="bibo-input" placeholder="e.g. What are Fractions?" /></div>
    <div class="field"><label>Content</label><textarea id="sec-content" class="bibo-input" placeholder="Write lesson content here..." style="min-height:120px;"></textarea></div>
    <div class="field-row">
      <div class="field" style="margin-bottom:0;"><label>Content Type</label>
        <select id="sec-type" class="bibo-input">
          <option value="TEXT">Text</option><option value="IMAGE">Image</option>
          <option value="VIDEO">Video</option><option value="ACTIVITY">Activity</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:0;"><label>Order</label><input id="sec-order" class="bibo-input" type="number" placeholder="1" min="1" /></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:18px;">
      <button class="btn btn-ghost" style="flex:1;" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="flex:1;" id="sec-btn" onclick="submitSection()">Add Section</button>
    </div>`);
}

async function submitSection() {
  const lessonId = parseInt(document.getElementById('sec-lesson').value);
  const title    = document.getElementById('sec-title').value.trim();
  const content  = document.getElementById('sec-content').value.trim();
  const type     = document.getElementById('sec-type').value;
  const order    = parseInt(document.getElementById('sec-order').value) || 1;
  const errEl    = document.getElementById('sec-err');
  const btn      = document.getElementById('sec-btn');

  errEl.textContent = '';
  errEl.style.display = 'none';

  if (!lessonId) {
    errEl.textContent = 'Select a lesson.';
    errEl.style.display = '';
    return;
  }

  if (!title) {
    errEl.textContent = 'Section title required.';
    errEl.style.display = '';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Adding...';

  try {
    await apiFetch('POST', '/lesson-sections', {
      lessonId,
      title,
      content,
      contentType: type,
      contentOrder: order
    });

    closeModal();
    showToast('Section added!', '📄');

    // refresh rendered sections in UI
    await loadSections(lessonId);

  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = '';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Add Section';
  }
}

async function loadSections(lessonId) {
  const container = document.getElementById('sections-content');
  if (!container || !lessonId) return;

  container.innerHTML = Loading();

  try {
    //const sections = await api.getSectionsByLesson(lessonId);
     const sections = await apiFetch('GET', `/lesson-sections/lesson/${lessonId}`);

    if (!sections || sections.length === 0) {
      container.innerHTML = Empty('📄', 'No sections yet', 'Add the first section for this lesson.');
      return;
    }

    container.innerHTML = `
      <div class="card" style="overflow:hidden;">
        <table class="data-table">
          <thead>
            <tr>
              <th>Order</th>
              <th>Title</th>
              <th>Type</th>
              <th>Content</th>
            </tr>
          </thead>
          <tbody>
            ${sections.map(section => `
              <tr>
                <td>${section.contentOrder ?? '—'}</td>
                <td>${section.title ?? '—'}</td>
                <td>${section.contentType ?? '—'}</td>
                <td>${section.content ?? '—'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  } catch (e) {
    container.innerHTML = `<div style="color:var(--accent-red);padding:16px;">⚠️ ${e.message}</div>`;
  }
}

// ═══════════════════════════════════════════
// PAGE: QUIZZES
// ═══════════════════════════════════════════
async function quizzes() {
  document.getElementById('page-container').innerHTML = `<div class="page">
    ${PageHeader('Quizzes', 'Create and manage lesson quizzes', '+ New Quiz', 'openCreateQuiz()')}
    <div class="card" style="padding:20px;background:var(--primary-light);border-color:#dde2ff;margin-bottom:24px;">
      <div style="display:flex;align-items:flex-start;gap:12px;">
        <span style="font-size:22px;">💡</span>
        <div><p style="font-weight:700;color:var(--primary);margin-bottom:4px;">Quiz Module</p>
        <p style="font-size:13px;color:var(--text-500);">Quizzes are linked to lessons. Add multiple-choice questions with 4 choices each. Set a passing score for students to progress.</p></div>
      </div>
    </div>
    <div id="quizzes-list">${Loading()}</div>
  </div>`;

  try {
    const subs = await apiFetch('GET', '/subjects');
    let all = [];
    for (const s of (subs || [])) {
      try {
        const ls = await apiFetch('GET', `/lessons/subject/${s.id}`);
        for (const l of (ls || [])) {
          try {
            const qs = await apiFetch('GET', `/quiz/lesson/${l.id}`);
            if (qs?.length) all.push(...qs.map(q => ({ ...q, lessonTitle: l.title, subjectName: s.name })));
          } catch (e) {}
        }
      } catch (e) {}
    }

    if (!all.length) {
      document.getElementById('quizzes-list').innerHTML = Empty('✅', 'No quizzes yet', 'Click "+ New Quiz" to create your first quiz.');
      return;
    }

    document.getElementById('quizzes-list').innerHTML = `
      <div class="card" style="overflow:hidden;">
        <table class="data-table">
          <thead><tr>
            <th>Quiz Title</th><th>Lesson</th><th>Subject</th><th>Passing Score</th><th>Questions</th>
          </tr></thead>
          <tbody>
            ${all.map(q => {
              const st = getSubjectStyle(q.subjectName);
              return `<tr>
                <td>
                  <div style="font-weight:700;color:var(--text-900);">${q.title}</div>
                  <div style="font-size:12px;color:var(--text-400);">${q.description || '—'}</div>
                </td>
                <td style="font-size:13px;">${q.lessonTitle}</td>
                <td><span style="display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:${st.color};">${st.icon} ${q.subjectName}</span></td>
                <td><span class="badge badge-blue">${q.passingScore}%</span></td>
                <td style="font-size:13px;color:var(--text-500);">${q.questions?.length || 0} questions</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  } catch (e) {
    document.getElementById('quizzes-list').innerHTML = `<div style="color:var(--accent-red);padding:20px;">⚠️ ${e.message}</div>`;
  }
}

let _qCount = 0;
async function openCreateQuiz() {
  _qCount = 0;
  let opts = '<option value="">Select lesson...</option>';
  try {
    const subs = await apiFetch('GET', '/subjects');
    for (const s of (subs || [])) {
      try {
        const ls = await apiFetch('GET', `/lessons/subject/${s.id}`);
        if (ls?.length) {
          opts += `<optgroup label="${s.name}">`;
          opts += ls.map(l => `<option value="${l.id}">${l.title}</option>`).join('');
          opts += `</optgroup>`;
        }
      } catch (e) {}
    }
  } catch (e) {}

  openModal(`
    <div class="modal-header"><div class="modal-title">✅ New Quiz</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div id="qz-err" style="display:none;background:#FEE2E2;color:#991B1B;font-size:13px;font-weight:700;padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:14px;"></div>
    <div class="field"><label>Lesson</label><select id="qz-lesson" class="bibo-input">${opts}</select></div>
    <div class="field"><label>Quiz Title</label><input id="qz-title" class="bibo-input" placeholder="e.g. Fractions Quiz" /></div>
    <div class="field"><label>Description</label><input id="qz-desc" class="bibo-input" placeholder="Optional" /></div>
    <div class="field"><label>Passing Score (%)</label><input id="qz-passing" class="bibo-input" type="number" value="75" min="0" max="100" /></div>
    <div style="border-top:1px solid var(--border);margin:16px 0;padding-top:16px;">
      <p style="font-size:13px;font-weight:700;color:var(--text-900);margin-bottom:4px;">Questions</p>
      <p style="font-size:12px;color:var(--text-400);margin-bottom:14px;">Mark the correct answer with the radio button.</p>
      <div id="qz-questions"></div>
      <button class="btn btn-ghost btn-sm" onclick="addQuestion()" style="width:100%;margin-top:8px;">+ Add Question</button>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="btn btn-ghost" style="flex:1;" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="flex:1;" id="qz-btn" onclick="submitQuiz()">Create Quiz</button>
    </div>`);
  addQuestion();
}

function addQuestion() {
  _qCount++;
  const n  = _qCount;
  const el = document.createElement('div');
  el.id = `qb-${n}`;
  el.style.cssText = 'background:var(--bg);border-radius:var(--radius-md);padding:16px;margin-bottom:12px;';
  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <span style="font-size:13px;font-weight:700;color:var(--text-700);">Question ${n}</span>
      ${n > 1 ? `<button style="background:none;border:none;cursor:pointer;color:var(--accent-red);font-size:12px;font-weight:700;" onclick="document.getElementById('qb-${n}').remove()">Remove</button>` : ''}
    </div>
    <input class="bibo-input" id="qt-${n}" placeholder="Enter question text..." style="margin-bottom:8px;" />
    ${['A','B','C','D'].map((k, i) => `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        <input type="radio" name="cr-${n}" value="${i}" id="r-${n}-${i}" style="accent-color:var(--primary);width:16px;height:16px;flex-shrink:0;" />
        <label for="r-${n}-${i}" style="font-size:12px;font-weight:700;color:var(--text-400);width:16px;">${k}</label>
        <input class="bibo-input" id="ch-${n}-${i}" placeholder="Choice ${k}..." style="flex:1;padding:9px 12px;" />
      </div>`).join('')}
    <p style="font-size:11px;color:var(--text-400);margin-top:4px;">Select the radio next to the correct answer.</p>`;
  document.getElementById('qz-questions').appendChild(el);
}

async function submitQuiz() {
  const lessonId     = document.getElementById('qz-lesson').value;
  const title        = document.getElementById('qz-title').value.trim();
  const desc         = document.getElementById('qz-desc').value.trim();
  const passingScore = parseInt(document.getElementById('qz-passing').value) || 75;
  const errEl        = document.getElementById('qz-err');

  if (!lessonId) { errEl.textContent = 'Select a lesson.';    errEl.style.display = ''; return; }
  if (!title)    { errEl.textContent = 'Quiz title required.'; errEl.style.display = ''; return; }

  const questions = [];
  const blocks = document.querySelectorAll('[id^="qb-"]');
  for (const block of blocks) {
    const n  = block.id.replace('qb-', '');
    const qt = document.getElementById(`qt-${n}`)?.value.trim();
    if (!qt) { errEl.textContent = `Question ${n} text required.`; errEl.style.display = ''; return; }
    const correct = block.querySelector(`input[name="cr-${n}"]:checked`);
    if (!correct)  { errEl.textContent = `Mark correct answer for Question ${n}.`; errEl.style.display = ''; return; }
    const correctIdx = parseInt(correct.value);
    const choices = [0, 1, 2, 3].map(i => {
      const t = document.getElementById(`ch-${n}-${i}`)?.value.trim();
      if (!t) return null;
      return { choiceText: t, correct: i === correctIdx };
    });
    if (choices.some(c => !c)) { errEl.textContent = `All 4 choices required for Question ${n}.`; errEl.style.display = ''; return; }
    questions.push({ questionText: qt, choices });
  }
  if (!questions.length) { errEl.textContent = 'Add at least one question.'; errEl.style.display = ''; return; }

  const btn = document.getElementById('qz-btn'); btn.disabled = true; btn.textContent = 'Creating...';
  try {
    await apiFetch('POST', '/quiz/create', { lessonId: parseInt(lessonId), title, description: desc, passingScore, questions });
    closeModal(); showToast('Quiz created!', '✅');
    await quizzes();
  } catch (e) {
    errEl.textContent = e.message; errEl.style.display = '';
    btn.disabled = false; btn.textContent = 'Create Quiz';
  }
}

              <th>Level</th>
