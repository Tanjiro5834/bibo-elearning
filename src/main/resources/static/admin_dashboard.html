<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIBO Portal</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="admin_dashboard.css">
  </head>
  <body>
    <button id="mobile-menu-btn" onclick="toggleSidebar()">
      <span></span><span></span><span></span>
    </button>
    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div id="toast"></div>

    <div id="app-layout">
      <nav id="sidebar">
        <div class="sidebar-logo">
          <div class="sidebar-logo-icon">B</div>
          <div>
            <div class="sidebar-logo-title">BIBO</div>
            <div
              class="sidebar-logo-sub"
              id="sidebar-role-label"
              style="color: var(--accent-orange)"
            >
              Portal
            </div>
          </div>
        </div>
        <div class="sidebar-nav" id="sidebar-nav-items"></div>
        <div
          class="sidebar-user-badge"
          id="sidebar-user-badge"
          style="background: linear-gradient(135deg, #1e2a78 0%, #3b3fc4 100%)"
        >
          <div
            style="
              font-size: 10px;
              font-weight: 700;
              letter-spacing: 0.8px;
              text-transform: uppercase;
              opacity: 0.7;
              margin-bottom: 4px;
            "
          >
            Logged in as
          </div>
          <div
            style="
              font-family: var(--font-display);
              font-size: 15px;
              font-weight: 800;
            "
            id="sidebar-username"
          >
            —
          </div>
          <div
            style="font-size: 11px; opacity: 0.75; margin-top: 2px"
            id="sidebar-role-display"
          >
            —
          </div>
        </div>
        <button class="sidebar-logout" onclick="logout()">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            width="16"
            height="16"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          Log Out
        </button>
      </nav>
      <div id="main-content">
        <div id="page-container"></div>
      </div>
    </div>

    <script src="admin_dashboard.js"></script>
  </body>
</html>
