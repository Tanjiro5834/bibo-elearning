<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIBO – Bacoor Learn</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="images/bibo-logo.jpg" />
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("bibo_theme"); } catch (e) {}
        if (t !== "dark" && t !== "light")
          t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    <button id="mobile-menu-btn" onclick="toggleSidebar()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div id="toast"></div>
    <div id="app"></div>

    <script src="index.js"></script>
  </body>
</html>
