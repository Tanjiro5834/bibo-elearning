spring.application.name=elearning

# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}

# ===============================
# DATABASE (MySQL)
# Defaults target local XAMPP. Override with env vars on the server.
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bibo?createDatabaseIfNotExist=true&serverTimezone=Asia/Manila}
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Manila
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# ===============================
# SECRETS — never commit real values.
# Set JWT_SECRET and GROQ_API_KEY as environment variables
# (IntelliJ: Run Configuration > Environment variables).
# ===============================
app.jwt.secret=${JWT_SECRET:dev-only-change-me-dev-only-change-me-32chars}
app.jwt.access-token-expiration=3600000
groq.api.key=${GROQ_API_KEY:}
# Groq model for the Bibo AI tutor. Groq retires models regularly (llama-3.3-70b-versatile
# was shut down Aug 2026); override with GROQ_MODEL. Current list: console.groq.com/docs/models
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

# ===============================
# UPLOADS (lesson images)
# Saved to UPLOAD_DIR/images and served at /uploads/images/**.
# On a server, point UPLOAD_DIR at a persistent disk.
# ===============================
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

server.error.include-stacktrace=never
server.error.include-message=always
spring.devtools.add-properties=false
